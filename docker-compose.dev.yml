version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: deals_platform_backend_dev
    ports:
      - "8080:8080"
    environment:
      # Профиль h2 будет активирован через Dockerfile.dev
      SPRING_PROFILES_ACTIVE: h2
    networks:
      - deals_platform_dev_network

networks:
  deals_platform_dev_network:
    driver: bridge
