version: '3.8'

services:
  backend:
    build: .
    container_name: deals_platform_backend
    ports:
      - "8080:8080"
    environment:
      # Профиль postgres будет активирован через Dockerfile
      # Настройки базы данных берутся из application-postgres.yml
      SPRING_PROFILES_ACTIVE: postgres
      # Переменные окружения для Render.com PostgreSQL
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    networks:
      - deals_platform_network

networks:
  deals_platform_network:
    driver: bridge
