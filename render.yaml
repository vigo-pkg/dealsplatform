# Workspace Professional — отдельно в аккаунте; здесь plan = тип инстанса (pro/basic и т.д.)
services:
  - type: web
    name: deals-platform-backend
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: basic
    region: frankfurt
    envVars:
      # Активируем профиль postgres для использования DatabaseConfig
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Render.com автоматически создаст эти переменные из PostgreSQL сервиса
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: deals-platform-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: deals-platform-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: deals-platform-postgres
          property: password
      # JWT настройки
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      # Порт сервера
      - key: SERVER_PORT
        value: 8080
      # Дополнительные настройки для стабильности
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: LOGGING_LEVEL_COM_DEALSPLATFORM
        value: INFO
      - key: LOGGING_LEVEL_ORG_HIBERNATE_SQL
        value: WARN

databases:
  - name: deals-platform-postgres
    databaseName: deals_platform
    user: deals_platform_user
    plan: basic
    region: frankfurt
