spring:
  datasource:
    # Render.com предоставляет connectionString, который преобразуется в DatabaseConfig
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deals_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  security:
    jwt:
      secret: dealsPlatformSecretKey2024VeryLongAndSecureKeyForJWTTokenGeneration
      expiration: 86400000 # 24 hours in milliseconds

server:
  port: 8080

logging:
  level:
    com.dealsplatform: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    # Логирование подключения к БД
    com.zaxxer.hikari: INFO
    org.springframework.jdbc: INFO
